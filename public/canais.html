    function getTeamBadgeHtml(teamName, directLogoUrl) {
      if (!teamName) return '';
      const initials = (teamName.slice(0, 3)).toUpperCase();

      if (directLogoUrl) {
        return '<span style="display:inline-flex;align-items:center;justify-content:center;position:relative;width:26px;height:26px;flex-shrink:0;"><img src="' + directLogoUrl + '" alt="' + teamName + '" style="width:26px;height:26px;object-fit:contain;" onerror="this.style.display=\'none\';if(this.nextElementSibling)this.nextElementSibling.style.display=\'inline-flex\';"><span style="display:none;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#1e293b;border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:9px;font-weight:900;">' + initials + '</span></span>';
      }

      const norm = teamName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      let slug = TEAM_SLUGS[norm];
      if (!slug) {
        for (const k in TEAM_SLUGS) {
          if (norm.includes(k) || k.includes(norm)) {
            slug = TEAM_SLUGS[k];
            break;
          }
        }
      }
      if (!slug) {
        slug = norm.split(' ').join('-');
      }

      let template = 'https://bolarolando.org/escudos/{slug}.webp';
      if (template.includes('corinthians.webp')) {
        template = template.replace('corinthians.webp', '{slug}.webp');
      }

      const bolarolandoMap = {
        'sao-paulo': 'spfc', 'sao paulo': 'spfc', 'spfc': 'spfc',
        'atletico-mineiro': 'mg', 'atletico mineiro': 'mg', 'atletico-mg': 'mg',
        'athletico-paranaense': 'pr', 'athletico-pr': 'pr',
        'santos-fc': 'santos', 'vasco-da-gama': 'vasco',
        'aa-ponte-preta': 'ponte', 'ponte-preta': 'ponte', 'ponte preta': 'ponte',
        'red-bull-bragantino': 'bragantino', 'real-madrid': 'madrid',
        'manchester-city': 'city', 'paris-saint-germain': 'psg', 'psg': 'psg',
        'fc-barcelona': 'barcelona', 'al-nassr': 'nassr', 'al-kholood': 'kholood'
      };
      const effectiveSlug = bolarolandoMap[slug] || bolarolandoMap[norm] || slug.replace(/-fc$/, '').replace(/-sc$/, '').replace(/-ec$/, '');
      
      let url = template;
      if (url.includes('{slug}')) {
        url = url.split('{slug}').join(effectiveSlug);
      } else if (url.includes('{name}')) {
        url = url.split('{name}').join(effectiveSlug);
      } else {
        const base = url.endsWith('/') ? url.slice(0, -1) : url;
        url = base + '/' + effectiveSlug + '.webp';
      }

      return '<span style="display:inline-flex;align-items:center;justify-content:center;position:relative;width:26px;height:26px;flex-shrink:0;"><img src="' + url + '" alt="' + teamName + '" style="width:26px;height:26px;object-fit:contain;" onerror="this.style.display=\'none\';if(this.nextElementSibling)this.nextElementSibling.style.display=\'inline-flex\';"><span style="display:none;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#1e293b;border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:9px;font-weight:900;">' + initials + '</span></span>';
    }

    function extractYouTubeInfo(channelsStr, confrontation) {
      if (!channelsStr) return null;
      const raw = channelsStr.trim();
      const lower = raw.toLowerCase();

      // 1. Explicit handle in text (e.g. "Youtube.com/@canalgoatbr" or "@CazeTV")
      const handleMatch = raw.match(/@([A-Za-z0-9_.-]+)/);
      if (handleMatch) {
        const handle = handleMatch[1];
        let displayName = '@' + handle;
        const hLow = handle.toLowerCase();
        if (hLow.includes('cazetv') || hLow.includes('caze')) displayName = 'CazéTV';
        else if (hLow.includes('canalgoat') || hLow.includes('goat')) displayName = 'Canal Goat';
        else if (hLow.includes('jovempanesportes') || hLow.includes('jovempan')) displayName = 'Jovem Pan Esportes';
        else if (hLow.includes('canalgolbrasil') || hLow.includes('golbrasil')) displayName = 'Canal Gol Brasil';
        else if (hLow.includes('ulissescostatv') || hLow.includes('ulisses')) displayName = 'Ulisses Costa TV';
        else if (hLow.includes('sportynetbrasil') || hLow.includes('sportynet')) displayName = 'SportyNet Brasil';
        else if (hLow.includes('paulistao')) displayName = 'Paulistão';
        else if (hLow.includes('desimpedidos')) displayName = 'Desimpedidos';

        return {
          url: 'https://www.youtube.com/@' + handle,
          name: displayName,
          isExactChannel: true
        };
      }

      // 2. Known YouTube broadcast channels mentioned by brand name
      if (lower.includes('cazé') || lower.includes('caze')) {
        return { url: 'https://www.youtube.com/@CazeTV', name: 'CazéTV', isExactChannel: true };
      }
      if (lower.includes('canal goat') || (lower.includes('goat') && lower.includes('youtube'))) {
        return { url: 'https://www.youtube.com/@canalgoatbr', name: 'Canal Goat', isExactChannel: true };
      }
      if (lower.includes('jovem pan')) {
        return { url: 'https://www.youtube.com/@jovempanesportes', name: 'Jovem Pan Esportes', isExactChannel: true };
      }
      if (lower.includes('desimpedidos')) {
        return { url: 'https://www.youtube.com/@desimpedidos', name: 'Desimpedidos', isExactChannel: true };
      }
      if (lower.includes('ulisses costa')) {
        return { url: 'https://www.youtube.com/@UlissesCostaTV', name: 'Ulisses Costa TV', isExactChannel: true };
      }
      if (lower.includes('gol brasil')) {
        return { url: 'https://www.youtube.com/@canalgolbrasil', name: 'Canal Gol Brasil', isExactChannel: true };
      }
      if (lower.includes('sportynet') && lower.includes('youtube')) {
        return { url: 'https://www.youtube.com/@SportyNetBrasil', name: 'SportyNet Brasil', isExactChannel: true };
      }
      if (lower.includes('paulistao') || lower.includes('paulistão')) {
        return { url: 'https://www.youtube.com/@paulistao', name: 'Paulistão', isExactChannel: true };
      }

      // 3. Generic YouTube mention
      if (lower.includes('youtube') || lower.includes('you tube')) {
        const query = confrontation ? (confrontation + ' ao vivo') : 'futebol ao vivo';
        return {
          url: 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query),
          name: 'YouTube',
          isExactChannel: false
        };
      }

      return null;
    }

    function parseMatchesHtml(html) {
      const dateMatch = html.match(/<h2><span[^>]*>(.*?)<\/span><\/h2>/i);
      const dateLabel = dateMatch ? dateMatch[1].replace(/&#8211;/g, '–').trim() : DEFAULT_DATE;
      document.getElementById('date-label').textContent = 'Fonte Mantos do Futebol · ' + dateLabel;

      const regex = /<h3><strong>(.*?)<\/strong><\/h3>[\s\S]*?<p><span[^>]*><strong>Canais:\s*(.*?)<\/strong><\/span><\/p>/gi;
      let m;
      const list = [];
      while ((m = regex.exec(html)) !== null) {
        const rawTitle = m[1].replace(/&#8211;/g, '–').replace(/&amp;/g, '&').trim();
        const rawChannels = m[2].replace(/&#8211;/g, '–').replace(/&amp;/g, '&').trim();
        const parts = rawTitle.split('–').map(s => s.trim());
        const time = parts[0] || '';
        const confrontation = parts[1] || '';
        const championship = parts.slice(2).join(' – ') || '';

        let matchedId = null;
        let matchedName = null;
        const chLower = rawChannels.toLowerCase();
        if (chLower.includes('premiere')) { matchedId = 'premiere-c'; matchedName = 'PREMIERE'; }
        else if (chLower.includes('sportv 2')) { matchedId = 'sportv-2'; matchedName = 'SPORTV 2'; }
        else if (chLower.includes('sportv 3')) { matchedId = 'sportv-3'; matchedName = 'SPORTV 3'; }
        else if (chLower.includes('sportv')) { matchedId = 'sportv-1'; matchedName = 'SPORTV 1'; }
        else if (chLower.includes('espn 2')) { matchedId = 'espn-2'; matchedName = 'ESPN 2'; }
        else if (chLower.includes('espn 3')) { matchedId = 'espn-3'; matchedName = 'ESPN 3'; }
        else if (chLower.includes('espn 4')) { matchedId = 'espn-4'; matchedName = 'ESPN 4'; }
        else if (chLower.includes('espn')) { matchedId = 'espn-1'; matchedName = 'ESPN 1'; }
        else if (chLower.includes('sportynet')) { matchedId = 'sportynet-1'; matchedName = 'SPORTYNET'; }
        else if (chLower.includes('bandsports')) { matchedId = 'bandsports'; matchedName = 'BANDSPORTS'; }

        list.push({
          time,
          confrontation,
          championship,
          channels: rawChannels,
          matchedId,
          matchedName,
          available: Boolean(matchedId)
        });
      }
      return list;
    }

    function renderMatches() {
      const container = document.getElementById('matches-container');
      const q = (document.getElementById('search-box').value || '').toLowerCase().trim();

      const filtered = allMatches.filter(m => {
        if (currentFilter === 'available' && !m.available) return false;
        if (currentFilter === 'youtube' && !extractYouTubeInfo(m.channels, m.confrontation)) return false;
        if (currentFilter === 'brasileirao' && !m.championship.toLowerCase().includes('brasileir')) return false;
        if (currentFilter === 'seriea' && !m.championship.toLowerCase().includes('serie a')) return false;
        if (currentFilter === 'copas' && !m.championship.toLowerCase().includes('copa') && !m.championship.toLowerCase().includes('libertadores')) return false;
        if (q && !m.confrontation.toLowerCase().includes(q) && !m.championship.toLowerCase().includes(q) && !m.channels.toLowerCase().includes(q)) return false;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8;">Nenhum jogo encontrado com esse filtro.</div>';
        return;

      container.innerHTML = '';

        const parts = m.confrontation.split(' x ').map(s => s.trim());

    // Helper to get realistic broadcast channel recommendations by competition / teams
    function getFallbackChannelsForCompetition(compName, homeTeam, awayTeam) {
      const lower = ((compName || '') + ' ' + (homeTeam || '') + ' ' + (awayTeam || '')).toLowerCase();
      if (lower.includes('ásia') || lower.includes('asia') || lower.includes('afc') || lower.includes('nassr') || lower.includes('hilal')) return 'ESPN 4, Disney+';
      if (lower.includes('liga dos campeões') || lower.includes('champions league') || lower.includes('champions')) return 'TNT Sports, Space, HBO Max, SBT';
      if (lower.includes('europa league') || lower.includes('liga europa')) return 'CazéTV, Disney+, ESPN';
      if (lower.includes('conference league')) return 'CazéTV, Disney+';
      if (lower.includes('premier league') || lower.includes('inglês') || lower.includes('ingles')) return 'ESPN, Disney+';
      if (lower.includes('laliga') || lower.includes('la liga') || lower.includes('espanhol')) return 'ESPN, Disney+';
      if (lower.includes('serie a') || lower.includes('italiano') || lower.includes('calcio')) return 'ESPN 4, Disney+';
      if (lower.includes('bundesliga') || lower.includes('alemão') || lower.includes('alemao')) return 'CazéTV, SporTV, RedeTV';
      if (lower.includes('ligue 1') || lower.includes('francês') || lower.includes('frances')) return 'CazéTV, YouTube';
      if (lower.includes('libertadores')) return 'Paramount+, Disney+, ESPN, TV Globo';
      if (lower.includes('sul-americana') || lower.includes('sudamericana')) return 'Paramount+, ESPN, Disney+';
      if (lower.includes('brasileirão') || lower.includes('brasileiro') || lower.includes('serie a') || lower.includes('série a')) return 'Premiere, SporTV, TV Globo';
      if (lower.includes('série b') || lower.includes('serie b')) return 'Premiere, SporTV, Canal GOAT, Band';
      if (lower.includes('copa do brasil')) return 'Premiere, SporTV, Prime Video, TV Globo';
      if (lower.includes('paulistão') || lower.includes('paulista')) return 'CazéTV, Record, HBO Max, TNT';
      if (lower.includes('carioca')) return 'Band, Canal GOAT, CazéTV';
      if (lower.includes('copa do rei')) return 'ESPN 4, Disney+';
      if (lower.includes('copa da inglaterra') || lower.includes('fa cup')) return 'ESPN, Disney+';
      if (lower.includes('saudita') || lower.includes('saudi') || lower.includes('roshn')) return 'BandSports, Canal GOAT, YouTube';
      return 'Disney+, ESPN 4, SporTV';
    }

    // Channel matcher helper for client-side / static hosting (GitHub Pages)
    function matchChannelFromText(text) {
      if (!text) return null;
      const lower = text.toLowerCase();
      if (lower.includes('premiere 2')) return { id: 'premiere-2', name: 'PREMIERE 2' };
      if (lower.includes('premiere 3')) return { id: 'premiere-3', name: 'PREMIERE 3' };
      if (lower.includes('premiere 4')) return { id: 'premiere-4', name: 'PREMIERE 4' };
      if (lower.includes('premiere 5')) return { id: 'premiere-5', name: 'PREMIERE 5' };
      if (lower.includes('premiere 6')) return { id: 'premiere-6', name: 'PREMIERE 6' };
      if (lower.includes('premiere 7')) return { id: 'premiere-7', name: 'PREMIERE 7' };
      if (lower.includes('premiere')) return { id: 'premiere-c', name: 'PREMIERE' };
      if (lower.includes('sportv 4')) return { id: 'sportv-4', name: 'SPORTV 4' };
      if (lower.includes('sportv 2')) return { id: 'sportv-2', name: 'SPORTV 2' };
      if (lower.includes('sportv 3')) return { id: 'sportv-3', name: 'SPORTV 3' };
      if (lower.includes('sportv')) return { id: 'sportv-1', name: 'SPORTV 1' };
      if (lower.includes('espn 2')) return { id: 'espn-2', name: 'ESPN 2' };
      if (lower.includes('espn 3')) return { id: 'espn-3', name: 'ESPN 3' };
      if (lower.includes('espn 4')) return { id: 'espn-4', name: 'ESPN 4' };
      if (lower.includes('espn 5')) return { id: 'espn-5', name: 'ESPN 5' };
      if (lower.includes('espn 6')) return { id: 'espn-6', name: 'ESPN 6' };
      if (lower.includes('espn')) return { id: 'espn-1', name: 'ESPN 1' };
      if (lower.includes('sportynet 2')) return { id: 'sportynet-2', name: 'SPORTYNET 2' };
      if (lower.includes('sportynet 3')) return { id: 'sportynet-3', name: 'SPORTYNET 3' };
      if (lower.includes('sportynet')) return { id: 'sportynet-1', name: 'SPORTYNET 1' };
      if (lower.includes('bandsports')) return { id: 'bandsports', name: 'BANDSPORTS' };
      if (lower.includes('max') || lower.includes('hbo') || lower.includes('tnt') || lower.includes('space')) return { id: 'max-1', name: 'HBO MAX / TNT' };
      if (lower.includes('disney') || lower.includes('star+')) return { id: 'disney-1', name: 'DISNEY+' };
      if (lower.includes('caze') || lower.includes('cazé')) return { id: 'cazetv-1', name: 'CAZÉTV' };
      if (lower.includes('paramount')) return { id: 'paramount-1', name: 'PARAMOUNT+' };
      if (lower.includes('prime video') || lower.includes('primevideo') || lower.includes('amazon prime')) return { id: 'primevideo-1', name: 'PRIME VIDEO' };
      if (lower.includes('record')) return { id: 'record', name: 'RECORD' };
      if (lower.includes('sbt')) return { id: 'sbt', name: 'SBT' };
      if (lower.includes('globo') || lower.includes('tv globo')) return { id: 'premiere-c', name: 'PREMIERE / GLOBO' };
      return null;
    }

    let currentDateMode = 'today';
    const clientTvNetworkCache = new Map();

    // Interactive date switcher for Ontem, Hoje e Amanhã (works on server & static GitHub Pages)
    async function changeDate(mode) {
      currentDateMode = mode;
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('date-btn-' + mode);
      if (activeBtn) activeBtn.classList.add('active');

      const statusBadge = document.getElementById('status-badge');
      const dateLabelEl = document.getElementById('date-label');
      if (statusBadge) statusBadge.textContent = 'Carregando jogos...';

      // Compute date label & DD/MM/YYYY
      const now = new Date();
      let targetDate = new Date();
      if (mode === 'yesterday') {
        targetDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
      } else if (mode === 'tomorrow') {
        targetDate = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      }
      const days = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
      const dayName = days[targetDate.getDay()];
      const d = String(targetDate.getDate()).padStart(2, '0');
      const m = String(targetDate.getMonth() + 1).padStart(2, '0');
      const y = targetDate.getFullYear();
      const dateStr = d + '/' + m + '/' + y;
      const fallbackDateLabel = dayName + ' – ' + d + '/' + m;
      if (dateLabelEl) dateLabelEl.textContent = 'Fonte 365Scores · ' + fallbackDateLabel;

      try {
        // 1. Try local full-stack server if running
        try {
          const res = await fetch('/api/jogos-hoje?date=' + mode + '&_t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (data.matches && data.matches.length > 0) {
              if (dateLabelEl) dateLabelEl.textContent = 'Fonte 365Scores · ' + (data.dateLabel || fallbackDateLabel);
              allMatches = data.matches.map(m => ({
                id: m.gameId || m.id,
                time: m.time,
                confrontation: m.confrontation,
                championship: m.championship,
                channels: m.channelsRaw,
                homeLogo: m.homeLogo || null,
                awayLogo: m.awayLogo || null,
                matchedId: m.matchedChannel ? m.matchedChannel.id : null,
                matchedName: m.matchedChannel ? m.matchedChannel.name : null,
                available: m.isAvailableInApp
              }));
              renderMatches();
              if (statusBadge) statusBadge.textContent = '● ' + allMatches.length + ' jogos carregados';
              return;
            }
          }
        } catch (e) {
          // Ignore and proceed to direct 365Scores fetch
        }

        // 2. Direct 365Scores API (CORS friendly, works natively on GitHub Pages)
        const scoresUrl = 'https://webws.365scores.com/web/games/allscores/?appTypeId=5&langId=31&timezoneName=America/Sao_Paulo&userCountryId=21&sports=1&startDate=' + encodeURIComponent(dateStr) + '&endDate=' + encodeURIComponent(dateStr);
        const scoresRes = await fetch(scoresUrl);
        if (scoresRes.ok) {
          const data = await scoresRes.json();
          const competitorsMap = new Map((data.competitors || []).map(c => [c.id, c]));
          const competitionsMap = new Map((data.competitions || []).map(c => [c.id, c]));
          const tvGames = (data.games || []).filter(g => g.hasTVNetworks);
          const rawGames = tvGames.length > 0 ? tvGames : (data.games || []);

          if (rawGames.length > 0) {
            allMatches = rawGames.map(g => {
              const home = competitorsMap.get(g.homeCompetitor ? g.homeCompetitor.id : null) || {};
              const away = competitorsMap.get(g.awayCompetitor ? g.awayCompetitor.id : null) || {};
              const comp = competitionsMap.get(g.competitionId) || {};
              let timeStr = 'A definir';
              if (g.startTime) {
                try {
                  const dt = new Date(g.startTime);
                  timeStr = dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
                } catch (e) {
                  timeStr = g.startTime.slice(11, 16);
                }
              }
              const conf = (home.name || 'Mandante') + ' x ' + (away.name || 'Visitante');
              const compName = comp.name || g.competitionDisplayName || 'Futebol Internacional';

              // Channel from cache or realistic competition broadcast
              let channelsText = clientTvNetworkCache.get(g.id);
              if (!channelsText) {
                channelsText = getFallbackChannelsForCompetition(compName, home.name, away.name);
              }

              const chMatch = matchChannelFromText(channelsText);
              return {
                id: g.id,
                time: timeStr,
                confrontation: conf,
                championship: compName,
                channels: channelsText,
                homeLogo: home.id ? 'https://imagecache.365scores.com/image/upload/f_png,c_limit,q_auto:eco,dpr_2/Competitors/' + home.id : null,
                awayLogo: away.id ? 'https://imagecache.365scores.com/image/upload/f_png,c_limit,q_auto:eco,dpr_2/Competitors/' + away.id : null,
                matchedId: chMatch ? chMatch.id : null,
                matchedName: chMatch ? chMatch.name : null,
                available: Boolean(chMatch)
              };
            });

            // Fast initial render with badges & fallback channels
            renderMatches();
            if (statusBadge) statusBadge.textContent = '● ' + allMatches.length + ' jogos carregados via 365Scores';

            // Background fetch exact TV networks for all games that have TV networks
            const gamesToFetch = rawGames.filter(g => g.hasTVNetworks && !clientTvNetworkCache.has(g.id)).slice(0, 35);
            if (gamesToFetch.length > 0) {
              Promise.allSettled(gamesToFetch.map(async g => {
                try {
                  const detailUrl = 'https://webws.365scores.com/web/game/?gameId=' + g.id + '&langId=31&appTypeId=5&userCountryId=21&timezoneName=America/Sao_Paulo';
                  const controller = new AbortController();
                  const tid = setTimeout(() => controller.abort(), 3000);
                  const detailRes = await fetch(detailUrl, { signal: controller.signal });
                  clearTimeout(tid);
                  if (detailRes.ok) {
                    const jd = await detailRes.json();
                    const nets = (jd.game?.tvNetworks || []).map(n => n.name).filter(Boolean);
                    if (nets.length > 0) {
                      const netStr = nets.join(', ');
                      clientTvNetworkCache.set(g.id, netStr);
                      const m = allMatches.find(item => item.id === g.id);
                      if (m) {
                        m.channels = netStr;
                        const matched = matchChannelFromText(netStr);
                        if (matched) {
                          m.matchedId = matched.id;
                          m.matchedName = matched.name;
                          m.available = true;
                        }
                      }
                    }
                  }
                } catch (e) {
                  // Fallback channel already assigned
                }
              })).then(() => {
                renderMatches();
              });
            }
            return;
          }
        }
      } catch (err) {
        console.warn('Erro ao atualizar data:', err);
      }

      // If fetch fails or runs offline, ensure current matches stay rendered
      renderMatches();
      if (statusBadge) statusBadge.textContent = '● Grade ativa (' + allMatches.length + ' jogos)';
    }

    async function checkLiveUpdates(isManual = false) {
      const statusBadge = document.getElementById('status-badge');
      if (isManual && statusBadge) statusBadge.textContent = 'Verificando atualizações...';
      await changeDate(currentDateMode);
    }

    // INITIALIZE: Render immediately from DEFAULT_MATCHES with zero delay!
    const initDate = getDeviceDateLabel() || DEFAULT_DATE;
    const initialDateLabelEl = document.getElementById('date-label');
    if (initialDateLabelEl) initialDateLabelEl.textContent = 'Fonte 365Scores · ' + initDate;
    renderMatches();

    // Then perform non-blocking background refresh
    setTimeout(() => checkLiveUpdates(false), 800);
  </script>
